services:
  - type: web
    name: farmsol-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: '*'
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false

  - type: static
    name: farmsol-farmer
    rootDir: frontend-farmer
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://farmsol-backend.onrender.com/api/v1
      - key: VITE_SOCKET_URL
        value: https://farmsol-backend.onrender.com

  - type: static
    name: farmsol-operator
    rootDir: frontend-operator
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://farmsol-backend.onrender.com/api/v1
      - key: VITE_SOCKET_URL
        value: https://farmsol-backend.onrender.com

  - type: static
    name: farmsol-admin
    rootDir: frontend-admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://farmsol-backend.onrender.com/api/v1
      - key: VITE_SOCKET_URL
        value: https://farmsol-backend.onrender.com
