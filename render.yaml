services:
  - type: web
    name: farmsol-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm --prefix backend run build
    startCommand: npm --prefix backend run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: '*'
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
